name: batch_audio_birding
description: "Batch bird sound analysis using BirdNET AI model"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # TFLite inference
  tflite_flutter: ^0.12.1

  # Selezione cartella / file
  file_picker: ^8.1.2

  # Decodifica audio multi-formato
  audio_decoder: ^0.8.0

  # State management
  flutter_riverpod: ^2.5.1

  # Persistenza impostazioni
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3
  path: ^1.9.0

  # Permessi Android
  permission_handler: ^11.3.1

  # Download file (modello TFLite)
  dio: ^5.4.3+1
  path_provider: ^2.1.3

  # Export CSV
  csv: ^6.0.0
  share_plus: ^10.0.0

  # Posizione GPS
  geolocator: ^13.0.1

  # UI extra
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  audioplayers: ^6.6.0
  fftea: ^1.5.0+1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/labels/
    - assets/model/
    - assets/icon/
